services:
  myteam:
    build:
      context: .
    container_name: myteam
    restart: unless-stopped
    environment:
      # 服务器上 MySQL/MariaDB 的连接信息（在项目目录 .env 文件里配置，compose 会自动读取）
      # 留空 = 应用使用本地模式（localStorage）；数据库在宿主机时可填 host.docker.internal
      DB_HOST: ${DB_HOST-}
      DB_PORT: ${DB_PORT-3306}
      DB_USER: ${DB_USER-}
      DB_PASSWORD: ${DB_PASSWORD-}
      DB_NAME: ${DB_NAME-myteam}
      KIMI_API_KEY: ${KIMI_API_KEY-}
      KIMI_MODEL: ${KIMI_MODEL-kimi-k2.6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL-deepseek-v4-flash}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: myteam-caddy
    restart: unless-stopped
    depends_on:
      - myteam
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
